<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>hw_32</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
<form novalidate data-form>
    <div class="mb-3">
        <label for="inputFirstName" class="form-label">First name</label>
        <input type="text" class="form-control" id="inputFirstName" data-inputFirstName>
    </div>
    <div class="mb-3">
        <label for="inputLastName" class="form-label">Last name</label>
        <input type="text" class="form-control" id="inputLastName" data-inputLastName>
    </div>
    <div class="mb-3">
        <label for="inputEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="inputEmail" data-inputEmail>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <button type="button" class="btn btn-primary" data-freezeBtn>Freeze model</button>
    <button type="button" class="btn btn-primary" data-showDescBtn>Show descriptors</button>
</form>
    <div class="text-danger mt-5" data-errors></div>
    <div class="mt-5" data-card></div>
    <pre data-descriptors></pre>
</div>
<script src="js/main.js" type="module"></script>
</body>
</html>
