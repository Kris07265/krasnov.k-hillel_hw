<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>hw_34</title>
</head>
<body>
<h1 class="mt-5 mb-5 text-center">Notes Board</h1>
<div class="container">
    <div class="row">
        <div class="col-4">
            <form data-notesForm>
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title">
                    <span class="text-danger" data-error-for="title"></span>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" class="form-select" aria-label="Default select example" name="category">
                        <option value="work">work</option>
                        <option value="study">study</option>
                        <option value="personal">personal</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Add note</button>
                    <button type="button" class="btn btn-danger" data-clearAllBtn>Clear all</button>
                </div>
            </form>
        </div>
        <div class="col-8">
            <div class="row" data-notesContainer></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/app.js" type="module"></script>
</body>
</html>
