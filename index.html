<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>hw_34</title>
</head>
<body>
<h1 class="mt-5 mb-5 text-center">Notes Board</h1>
<div class="container">
    <div class="row">
        <div class="notesFilter text-end mb-3" data-notesFilter>
            <h6 class="mb-3">Notes filter</h6>
            <button class="btn btn-sm btn-outline-primary" data-notesFilterAll>All</button>
            <button class="btn btn-sm btn-outline-warning" data-notesFilterImportant>Important</button>
            <label for="notesFilterSelectCategory">Category</label>
            <select id="notesFilterSelectCategory" class="form-select-sm" data-notesFilterSelectCategory>
                <option selected value="all">All categories</option>
                <option value="work">work</option>
                <option value="study">study</option>
                <option value="personal">personal</option>
            </select>
            <label for="notesSortSelect">Sort</label>
            <select id="notesSortSelect" class="form-select-sm" data-notesSortSelect>
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
            </select>
        </div>
        <div class="col-4">
            <form data-notesForm>
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title">
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" class="form-select" aria-label="Default select example" name="category">
                        <option value="work">work</option>
                        <option value="study">study</option>
                        <option value="personal">personal</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Add note</button>
                    <button type="button" class="btn btn-danger" data-clearAllBtn>Clear all</button>
                </div>
                <div class="border border-2 border-primary p-1 mt-2" data-totalNotes>Total notes: 0</div>
                <div class="border border-2 border-warning p-1 mt-2" data-importantNotes>Important: 0</div>
                <span class="text-danger" data-errorMassage></span>
            </form>
        </div>
        <div class="col-8">
            <div class="row" data-notesContainer></div>
        </div>
    </div>
</div>

<div id="editTitleModal" class="modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" data-editModalTitle>Edit title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editTitleForm">
                    <div class="mb-3">
                        <label for="editTitle" class="form-label">Title</label>
                        <input type="text" class="form-control" id="editTitle" name="title">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary" form="editTitleForm">Save changes</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast bg-danger" role="alert" aria-live="assertive" aria-atomic="true" data-errorToast>
        <div class="toast-header">
            <strong class="me-auto">Error deleting notes</strong>
            <small>Now!</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
            The notes board is empty!
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/app.js" type="module"></script>
</body>
</html>
